---
# Builds an unsigned VibepolloSetup.exe for this fork, so a machine can install a build
# without the MSYS2, .NET, WiX and Node toolchain. Install it with scripts/install-local.ps1.
# Download the build-Windows artifact (kept 7 days) from the run page.
name: Fork installer
permissions: {}

on:
  # Every pull request in this fork gets an installer to test, whatever its base branch.
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      build_version:
        description: Version embedded in the installer; 2.0.7 or later installs over 2.0.6.
        required: false
        type: string
        default: '2.0.7'

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build unsigned installer
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/ci-windows.yml
    with:
      release_commit: ${{ github.sha }}
      release_version: ${{ inputs.build_version || '2.0.7' }}
      release_tag: ''
      release_artifact_retention_days: 7
      symbol_product_name: Vibepollo
      symbol_release_prefix: polo
      publish_symbols: false
      upload_symbols_artifact: false
